<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Zynochat</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-container {
      padding: 80px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: var(--container);
      margin: 0 auto;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .stat-card {
      padding: 20px;
      background: var(--bg-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-m);
      text-align: center;
      box-shadow: var(--shadow-l);
    }
    .stat-val {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-hot);
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-3);
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 4px;
    }
    .admin-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .admin-table-wrap {
      background: var(--bg-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-m);
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .admin-table th, .admin-table td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-1);
    }
    .admin-table th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-3);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .btn-action {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border-1);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ban { background: #ff4444; color: #fff; border: none; }
    .btn-ban:hover { background: #cc3333; }
    .btn-restore { background: #00e676; color: #fff; border: none; }
    .btn-restore:hover { background: #00b354; }

    .logs-box {
      background: var(--bg-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-m);
      padding: 16px;
      max-height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-entry {
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding-bottom: 4px;
    }
    .log-time { color: var(--accent-hot); }
    .log-action { color: #fff; font-weight: bold; }
  </style>
</head>
<body class="bg-0">

<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2C5.58 2 2 5.58 2 10c0 1.85.6 3.56 1.6 4.95L2.05 17.5a.5.5 0 00.63.63l2.55-1.55A7.96 7.96 0 0010 18c4.42 0 8-3.58 8-8s-3.58-8-8-8zm-3 6h6a.5.5 0 010 1H7a.5.5 0 010-1zm0 2.5h4a.5.5 0 010 1H7a.5.5 0 010-1z"/></svg>
        <span>Zyno Admin</span>
      </a>
    </div>
    <div class="header-right">
      <a href="profile.html">
        <div class="profile-box" id="user-dp">A</div>
      </a>
    </div>
  </div>
</header>

<main class="admin-container">
  <div class="stat-cards">
    <div class="stat-card">
      <div class="stat-val" id="stat-users">0</div>
      <div class="stat-label">Total Registered Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-reports">0</div>
      <div class="stat-label">Abuse Reports</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-logs">0</div>
      <div class="stat-label">Security Audit Trails</div>
    </div>
  </div>

  <div class="admin-section">
    <h3 class="section-label" style="font-family: 'Syne'; font-size: 18px;">Dynamic User Moderation</h3>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email Address</th>
            <th>System Role</th>
            <th>Account Status</th>
            <th>Moderation Action</th>
          </tr>
        </thead>
        <tbody id="user-rows-container">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-3);">Loading users index...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="admin-section">
    <h3 class="section-label" style="font-family: 'Syne'; font-size: 18px;">System Security Audit Log</h3>
    <div class="logs-box" id="audit-logs-container">
      Loading audit logs...
    </div>
  </div>
</main>

<nav class="bottom-nav" id="main-bottom-nav">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>Home</span>
  </a>
  <a href="chat.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Chats</span>
  </a>
  <a href="ai-chat.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    <span>AI</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Profile</span>
  </a>
  <a href="settings.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82"/></svg>
    <span>Settings</span>
  </a>
</nav>

<script src="app.js" type="module"></script>
<script type="module">
  import { apiCall } from './app.js';

  async function loadAdminData() {
    try {
      const users = await apiCall('/api/admin/users');
      const reports = await apiCall('/api/admin/reports');
      const auditLogs = await apiCall('/api/admin/audit-logs');

      // Update counters
      document.getElementById('stat-users').textContent = users.length;
      document.getElementById('stat-reports').textContent = reports.length;
      document.getElementById('stat-logs').textContent = auditLogs.length;

      // Populate Users list
      const userContainer = document.getElementById('user-rows-container');
      userContainer.replaceChildren();

      users.forEach(u => {
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        tdName.textContent = `@${u.username}`;
        tdName.style.fontWeight = '600';

        const tdEmail = document.createElement('td');
        tdEmail.textContent = u.email;

        const tdRole = document.createElement('td');
        tdRole.textContent = u.role.toUpperCase();
        tdRole.style.color = u.role === 'admin' ? 'var(--accent-hot)' : 'var(--text-2)';

        const tdStatus = document.createElement('td');
        tdStatus.textContent = u.isBanned ? 'Banned' : 'Active';
        tdStatus.style.color = u.isBanned ? '#ff4444' : '#00e676';
        tdStatus.style.fontWeight = 'bold';

        const tdAction = document.createElement('td');
        if (u.role !== 'admin') {
          const btn = document.createElement('button');
          btn.className = `btn-action ${u.isBanned ? 'btn-restore' : 'btn-ban'}`;
          btn.textContent = u.isBanned ? 'Restore Account' : 'Suspend Account';
          btn.onclick = async () => {
            try {
              if (u.isBanned) {
                await apiCall(`/api/admin/unban/${u.id}`, 'POST');
              } else {
                await apiCall(`/api/admin/ban/${u.id}`, 'POST');
              }
              loadAdminData();
            } catch (err) {
              alert(err.message);
            }
          };
          tdAction.appendChild(btn);
        } else {
          tdAction.textContent = 'Protected';
          tdAction.style.color = 'var(--text-3)';
        }

        tr.append(tdName, tdEmail, tdRole, tdStatus, tdAction);
        userContainer.appendChild(tr);
      });

      // Populate Audit Logs
      const logsContainer = document.getElementById('audit-logs-container');
      logsContainer.replaceChildren();

      auditLogs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'log-entry';

        const spanTime = document.createElement('span');
        spanTime.className = 'log-time';
        spanTime.textContent = `[${new Date(log.timestamp).toLocaleTimeString()}] `;

        const spanAction = document.createElement('span');
        spanAction.className = 'log-action';
        spanAction.textContent = `${log.action.toUpperCase()} `;

        const textDetails = document.createTextNode(`- UserId: ${log.userId} (${JSON.stringify(log.details || {})})`);

        div.append(spanTime, spanAction, textDetails);
        logsContainer.appendChild(div);
      });

    } catch (err) {
      console.error('Admin panel loading failure:', err);
    }
  }

  // Load immediately when session available
  setTimeout(loadAdminData, 600);
</script>
</body>
</html>

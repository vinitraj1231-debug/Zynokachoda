<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Zynochat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 32px;">
      <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 12px;">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2C5.58 2 2 5.58 2 10c0 1.85.6 3.56 1.6 4.95L2.05 17.5a.5.5 0 00.63.63l2.55-1.55A7.96 7.96 0 0010 18c4.42 0 8-3.58 8-8s-3.58-8-8-8zm-3 6h6a.5.5 0 010 1H7a.5.5 0 010-1zm0 2.5h4a.5.5 0 010 1H7a.5.5 0 010-1z"/></svg>
        <span>Zyno</span>
      </a>
      <h2 id="auth-title" style="font-family: 'Syne'; font-size: 24px; font-weight: 800;">Welcome to Zyno</h2>
      <p id="auth-subtitle" style="color: var(--text-3); font-size: 14px;">Sign in with your email or username to continue</p>
    </div>

    <!-- Secure Login / Register Form -->
    <form id="login-form">
      <div class="form-group" style="margin-bottom: 16px;">
        <input type="text" id="email" class="auth-input" placeholder="Enter username or email" required>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <input type="password" id="password" class="auth-input" placeholder="Enter secure password" required>
      </div>
      <button type="submit" class="btn-auth" id="login-btn">Authenticate Securely</button>
    </form>

    <div style="text-align: center; margin-top: 16px;">
      <a href="#" id="toggle-flow-btn" style="color: var(--accent-hot); font-size: 13px; font-weight: 600;">Need an account? Register instead</a>
    </div>

    <div style="text-align: center; margin-top: 12px;">
      <a href="#" id="back-to-login" style="color: var(--text-3); font-size: 13px;">Forgot password?</a>
    </div>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px;" id="social-auth">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
        <div style="flex: 1; height: 1px; background: var(--border-1);"></div>
        <span style="font-size: 12px; color: var(--text-3);">OR</span>
        <div style="flex: 1; height: 1px; background: var(--border-1);"></div>
      </div>
      <button id="google-login" class="glass-panel" style="width: 100%; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">
        Continue with Google
      </button>
    </div>
  </div>

<script src="app.js" type="module"></script>
<script>
  const toggleBtn = document.getElementById('toggle-flow-btn');
  const loginForm = document.getElementById('login-form');
  const authTitle = document.getElementById('auth-title');
  const authSubtitle = document.getElementById('auth-subtitle');
  const loginBtn = document.getElementById('login-btn');

  if (toggleBtn && loginForm) {
    toggleBtn.onclick = (e) => {
      e.preventDefault();
      const isLogin = !loginForm.getAttribute('data-flow') || loginForm.getAttribute('data-flow') === 'login';
      if (isLogin) {
        loginForm.setAttribute('data-flow', 'register');
        authTitle.textContent = 'Create Zyno Account';
        authSubtitle.textContent = 'Join the highly secured real-time lounging system';
        loginBtn.textContent = 'Create Secure Account';
        toggleBtn.textContent = 'Already have an account? Login instead';
      } else {
        loginForm.setAttribute('data-flow', 'login');
        authTitle.textContent = 'Welcome to Zyno';
        authSubtitle.textContent = 'Sign in with your email or username to continue';
        loginBtn.textContent = 'Authenticate Securely';
        toggleBtn.textContent = 'Need an account? Register instead';
      }
    };
  }
</script>
</body>
</html>
